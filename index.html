<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argentic47</title>
<meta name="description" content="Practical AI and automation that gives teams their time back.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='3' width='58' height='58' fill='%23F7F8F9' stroke='%23252A31' stroke-width='3'/%3E%3Ctext x='32' y='43' font-family='Helvetica,Arial' font-size='26' text-anchor='middle' fill='%23252A31'%3EAg%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#F7F8F9;
    --ink:#252A31;
    --muted:#6B737D;
    --silver:#A9B1BA;
    --line:#D5DAE0;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hanken Grotesk",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    min-height:100vh;min-height:100svh;
    display:grid;grid-template-rows:1fr auto;
    padding:clamp(1.5rem,5vw,4.5rem);
  }
  main{align-self:end;max-width:40rem;padding-bottom:clamp(3rem,10vh,7rem)}

  .name{
    margin:0;font-weight:300;letter-spacing:-.035em;line-height:1;
    font-size:clamp(3.2rem,11vw,7.5rem);
  }
  /* Element notation: 47 sits where an atomic number would */
  .name sup{
    font-size:max(.26em,1.05rem);font-weight:400;letter-spacing:0;vertical-align:top;
    position:relative;top:.35em;margin-left:.12em;
    background:linear-gradient(100deg,#7D8690 0%,#B4BBC3 35%,#E4E8EC 50%,#A3ABB4 65%,#7D8690 100%);
    background-size:250% 100%;background-position:100% 0;
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .rule{width:3rem;height:1px;background:var(--silver);margin:2.25rem 0 1.75rem;border:0}
  .line{margin:0;font-size:clamp(1.1rem,2.2vw,1.35rem);line-height:1.5;color:var(--muted);font-weight:400;max-width:28rem}
  .email{
    display:inline-block;margin-top:2.25rem;font-size:clamp(1.05rem,2vw,1.2rem);font-weight:500;
    color:var(--ink);text-decoration:none;border-bottom:1px solid var(--silver);padding-bottom:.2rem;
  }
  .email:hover{border-bottom-color:var(--ink)}
  .email:focus-visible{outline:2px solid var(--ink);outline-offset:4px}

  footer{
    display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;
    font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:1.25rem;
  }
  .ag{display:inline-flex;align-items:baseline;gap:.35rem;color:var(--muted)}
  .ag b{font-weight:500;color:var(--ink)}

  @media (prefers-reduced-motion:no-preference){
    .name sup{animation:sheen 2.4s ease-out .6s both}
    @keyframes sheen{from{background-position:100% 0}to{background-position:0 0}}
  }
</style>
</head>
<body>
  <div class="page">
    <main>
      <h1 class="name">Argentic<sup>47</sup></h1>
      <hr class="rule">
      <p class="line">Practical AI and automation that gives teams their time back.</p>
      <a class="email" href="mailto:ag@argentic47.com">ag@argentic47.com</a>
    </main>
    <footer>
      <span>© 2026 Argentic47 Inc.</span>
      <span class="ag" title="Silver, element 47"><b>Ag</b> 47</span>
    </footer>
  </div>
</body>
</html>
